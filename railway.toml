# Default Railway service = FastAPI API (repo root Dockerfile).
# Create additional services in the Railway project for Postgres and (optionally)
# the Next.js frontend — see docs/deployment/railway.md.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/v1/health/live"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build frontend release image
        run: >-
          docker build
          --build-arg NEXT_PUBLIC_APP_URL=https://interview.invalid
          --tag intervia-web:ci
          .
      - name: Scan frontend image for high and critical vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
          intervia-web:ci

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.9.17"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Verify code, migrations, and real PostgreSQL integration
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Build and verify release image contract
        shell: pwsh
        env:
          IMAGE: ai-interviewer-platform:ci
          RELEASE_VERSION: 0.1.0-ci.${{ github.run_number }}
        run: |
          $created = [DateTimeOffset]::UtcNow.ToString("o")
          docker build `
            --build-arg "BUILD_VERSION=$env:RELEASE_VERSION" `
            --build-arg "BUILD_REVISION=$env:GITHUB_SHA" `
            --build-arg "BUILD_CREATED=$created" `
            --tag $env:IMAGE `
            .
          if ($LASTEXITCODE -ne 0) { throw "Release image build failed" }
          ./scripts/verify-release-image.ps1 `
            -Image $env:IMAGE `
            -ExpectedVersion $env:RELEASE_VERSION `
            -ExpectedRevision $env:GITHUB_SHA
      - name: Scan runtime image for high and critical vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
          ai-interviewer-platform:ci
      - name: Scan PostgreSQL image for high and critical vulnerabilities
        run: >-
          docker run --rm
          --volume /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --no-progress
          ai-interviewer-postgres:17.11-secure
      - name: Generate CycloneDX release SBOM
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          docker run --rm `
            --volume /var/run/docker.sock:/var/run/docker.sock `
            aquasec/trivy@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 `
            image --format cyclonedx --output /dev/stdout --no-progress `
            ai-interviewer-platform:ci | Set-Content -Encoding utf8 build/release-sbom.cdx.json
          if ($LASTEXITCODE -ne 0) { throw "SBOM generation failed" }
          Get-Content -Raw build/release-sbom.cdx.json | ConvertFrom-Json | Out-Null
      - name: Retain release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ github.sha }}
          path: build/release-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
